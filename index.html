<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>王渼荃 | 影视导演 & AI影像探索者</title>
 
 <!-- 字体与图标 -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
 <style>
 /* --- 1. 设计系统 --- */
 :root {
 --card-bg-color: rgba(255, 255, 255, 0.75);
 --text-color: #4D1308; /* 还原为原始褐色 */
 --heading-color: #C86A85;
 --subtitle-color: #A27764; /* 还原为原始褐色 */
 --primary-color: #E6B2BE;
 --font-heading: 'Playfair Display', serif;
 --font-body: 'Noto Sans SC', sans-serif;
 --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.07); /* 原巧克力色修改为黑色 */
 --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.12); /* 原巧克力色修改为黑色 */
 }

 /* --- 2. 基础与背景设置 --- */
 * { margin: 0; padding: 0; box-sizing: border-box; }
 html { scroll-behavior: smooth; }

 body {
 font-family: var(--font-body);
 color: var(--text-color);
 line-height: 1.8;
 -webkit-font-smoothing: antialiased;
 background-color: #f0f2f1; /* 备用底色 */
 }
 
 #app-wrapper {
 position: relative;
 z-index: 1; 
 padding-top: 90px;
 }
 
 /* --- 3. 导航栏与通用磨砂效果 --- */
 .navbar {
 position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
 padding: 20px 0;
 /* 导航栏背景图使用首页背景，不需要磨砂 */
 background-image: url('assets/images/mother-of-pearl.jpg'); /* 使用首页背景图 */
 background-size: cover;
 background-position: center center;
 background-repeat: no-repeat;
 background-color: transparent; /* 确保背景图可见 */
 backdrop-filter: none; /* 移除磨砂效果 */
 -webkit-backdrop-filter: none;
 border-bottom: 1px solid rgba(0, 0, 0, 0.1); /* 原巧克力色修改为黑色 */
 }
 .project-card, .contact-container, .timeline-dot, .modal-content {
 background: var(--card-bg-color);
 backdrop-filter: blur(10px);
 -webkit-backdrop-filter: blur(10px);
 }
 
 /* --- 4. 【核心】为不同板块设置背景、叠加层与自然过渡 --- */
 section, footer {
 position: relative;
 padding: 80px 0;
 background-size: cover;
 background-position: center center;
 background-repeat: no-repeat;
 background-attachment: fixed;
 isolation: isolate; /* 确保伪元素在内容之下 */
 }

 /* 创建通用的叠加层，用于实现背景磨砂和过渡效果 */
 section::before, footer::before {
 content: '';
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 z-index: -1;
 /* 默认值，会被下面具体板块的样式覆盖 */
 background: transparent;
 /* 确保 backdrop-filter 也应用在伪元素上 */
 backdrop-filter: blur(0px); /* 默认不模糊 */
 -webkit-backdrop-filter: blur(0px);
 transition: background-color 0.5s ease, backdrop-filter 0.5s ease; /* 添加过渡效果 */
 }
 
 /* 【新增】为首页添加40%透明度叠加层 */
 #home::before {
 background-color: rgba(255, 255, 255, 0.4);
 backdrop-filter: blur(0px); /* 首页背景不模糊 */
 -webkit-backdrop-filter: blur(0px);
 }

 /* 【核心】为需要过渡的板块添加渐变叠加层 */
 /* #portfolio 变为 40% 白色磨砂 */
 #portfolio::before {
 background-color: rgba(255, 255, 255, 0.4); /* 40% 白色叠加 */
 backdrop-filter: blur(5px); /* 磨砂效果 */
 -webkit-backdrop-filter: blur(5px);
 }

 #timeline::before {
 /* 从顶部15%的区域由透明渐变到50%透明度的白色 */
 /* 修改为直接50%白色磨砂,与portfolio平滑过渡，同时为about做准备 */
 background-color: rgba(255, 255, 255, 0.5); /* 50% 白色叠加 */
 backdrop-filter: blur(5px); /* 磨砂效果 */
 -webkit-backdrop-filter: blur(5px);
 }
 #about::before {
 background-color: rgba(255, 255, 255, 0.5); /* about紧跟timeline，保持50%透明度磨砂 */
 backdrop-filter: blur(5px); /* 磨砂效果 */
 -webkit-backdrop-filter: blur(5px);
 }
 #contact::before {
 /* 从50%透明度渐变到0%透明度，平滑过渡到footer */
 background: linear-gradient(to bottom, 
 rgba(255, 255, 255, 0.5) 0%, /* 从50%透明度开始 */
 rgba(255, 255, 255, 0.2) 50%, /* 中间过渡到20% */
 rgba(255, 255, 255, 0) 100%); /* 底部完全透明 */
 backdrop-filter: blur(3px); /* 稍微模糊，逐渐减弱 */
 -webkit-backdrop-filter: blur(3px);
 }
 /* footer紧跟contact，其before元素保持透明，不加模糊，直接露出背景图 */
 footer::before {
 background-color: transparent;
 backdrop-filter: blur(0px);
 -webkit-backdrop-filter: blur(0px);
 }


 /* 设置各板块的背景图片 */
 #home {
 background-image: url('assets/images/mother-of-pearl.jpg');
 min-height: calc(100vh - 90px); 
 display: flex; 
 align-items: center;
 padding-top: 0;
 }

 #portfolio {
 background-image: url('assets/images/background-portfolio.jpg');
 }

 #timeline, #about {
 background-image: url('assets/images/background-portfolio(1).jpg');
 }

 #contact, footer {
 background-image: url('assets/images/mother-of-pearl.jpg');
 }
 footer { 
 padding: 40px 0; 
 text-align: center; /* 页脚版权居中 */
 }
 
 /* --- 5. 内容与板块样式 --- */
 .container { 
 position: relative;
 z-index: 2; /* 确保内容在叠加层之上 */
 max-width: 1200px; 
 margin: 0 auto; 
 padding: 0 40px; /* 默认容器内边距 */
 }

 .section-title { text-align: center; margin-bottom: 60px; }
 .section-title h2 { font-family: var(--font-heading); font-size: 42px; color: var(--text-color); margin-bottom: 10px; }
 .section-title p { font-size: 16px; color: var(--subtitle-color); max-width: 600px; margin: 0 auto; }
 .btn { display: inline-block; background: var(--primary-color); color: var(--text-color); padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; border: 2px solid var(--primary-color); transition: all 0.3s ease; box-shadow: var(--shadow-sm); }
 .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); background: #e9a5b4; }
 .btn-secondary { background: transparent; color: var(--heading-color); border-color: var(--heading-color); box-shadow: none; }
 .btn-secondary:hover { background: var(--heading-color); color: #fff; box-shadow: 0 4px 15px rgba(208, 110, 137, 0.3); }
 
 /* 首页布局调整 - 核心修改区域 */
 #home .container { 
 max-width: 1200px; /* 限制首页容器的最大宽度 */
 padding: 0 40px; /* 保持左右内边距 */
 }

 .hero-container { 
 display: grid; 
 /* 调整网格比例：左侧文本区域和右侧图片区域更平衡 */
 grid-template-columns: 1fr 1.4fr; /* 文本略多于图片，给图片更多空间 */
 align-items: center; 
 gap: 60px; /* 增加两列之间的间隙 */
 width: 100%; 
 margin: 0 auto; /* 居中整个hero区域 */
}
 .hero-text {
 text-align: left; 
 padding-left: 0; 
 margin-left: 0;
 }
 /* 首页字体保持之前的尺寸 */
 .hero-text p[data-lang-key="hero_greeting"] { font-size: 20px; } /* 你好，我是 */
 .hero-text h1 { font-family: var(--font-heading); font-size: 54px; font-weight: 700; color: var(--heading-color); line-height: 1.2; margin: 8px 0; } /* 名字 */
 .hero-text .typed-output { 
 font-size: 24px; /* 影视导演 */
 color: var(--subtitle-color); 
 font-weight: 500; 
 margin-bottom: 15px; 
 height: auto; 
 white-space: nowrap; /* 确保不换行 */
 min-height: 30px; /* 确保 Typed.js 元素有最小高度，避免内容跳动 */
}
 .hero-text p[data-lang-key="hero_intro"] { 
 font-size: 16px; /* 介绍段落 */
 color: var(--text-color); 
 opacity: 0.9; 
 max-width: 500px; /* 恢复一个合理的宽度，避免文本过长 */
 margin: 15px 0 25px 0; 
 }
 .hero-actions { display: flex; gap: 15px; /* 按钮保持在一行 */ }
 
 /* 首页图片和背景圆圈调整 */
 .hero-image-wrapper { 
 position: relative; 
 display: flex; 
 justify-content: center; /* 在网格中居中 */
 align-items: center;
 width: 100%; 
 max-width: 500px; /* 进一步限制图片组件的最大宽度，使其在网格列内放大 */
 margin: 0 auto; /* 在其网格列内居中 */
 aspect-ratio: 1 / 1; /* 保持宽高比 */
 overflow: visible; /* 允许内容溢出 */
 }
 .hero-image-wrapper .background-shape {
 /* 圆环占父容器的100% */
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%); 
 width: 100%; /* 占其父容器（hero-image-wrapper）的100% */
 height: 100%;
 background-color: rgba(255, 255, 255, 0.4); 
 backdrop-filter: blur(10px);
 -webkit-backdrop-filter: blur(10px);
 border-radius: 50%;
 box-shadow: var(--shadow-md);
 z-index: 1; 
 display: block; 
 }
 .hero-image-wrapper img {
 /* 照片占父容器的80% */
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%); 
 width: 80%; /* 占其父容器（hero-image-wrapper）的80% */
 height: 80%; 
 object-fit: cover;
 border-radius: 50%; 
 box-shadow: var(--shadow-sm); 
 z-index: 2; 
 }

 .typed-cursor {
 opacity: 1;
 animation: blink 0.7s infinite;
}
 @keyframes blink { 50% { opacity: 0; } } 

 .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
 .portfolio-category-title { grid-column: 1 / -1; font-family: var(--font-heading); font-size: 28px; color: var(--text-color); margin: 40px 0 10px 0; padding-bottom: 10px; border-bottom: 2px solid rgba(0, 0, 0, 0.2); }
 .project-card { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; display: flex; flex-direction: column; }
 .project-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-md); }
 .project-image img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
 .project-content { padding: 25px; flex-grow: 1;}
 .project-content .tags { 
 font-size: 12px; 
 font-weight: 700; 
 color: var(--subtitle-color); 
 background-color: rgba(162, 119, 100, 0.1); 
 padding: 4px 10px; 
 border-radius: 20px; 
 margin-bottom: 5px; 
 display: inline-block; 
 line-height: 1.8; 
 margin-right: 8px; /* 标签之间间距 */
 white-space: nowrap; /* 确保标签内容不换行 */
}
 .project-content .tags span {
 display: inline-block; /* 确保每个标签都是独立的行内块元素 */
 margin-bottom: 5px; /* 标签行之间的间距 */
 }
 /* 作品集第三个标签（奖项）的样式 */
 .project-content .tags .project-tags-awards {
 font-size: 10px; /* 字体缩小 */
 font-weight: 500; /* 可以调整权重，保持可读性 */
 /* 如果需要，可以调整颜色 */
 background-color: transparent; /* 奖项标签不需要背景色 */
 padding: 0; /* 奖项标签不需要内边距 */
 border-radius: 0; /* 奖项标签不需要圆角 */
 }

 .project-content h3 { font-family: var(--font-heading); font-size: 22px; color: var(--text-color); margin-bottom: 10px; }
 .timeline-container { max-width: 800px; margin: 0 auto; position: relative; }
 .timeline-container::before { content: ''; position: absolute; left: 20px; top: 20px; bottom: 20px; width: 4px; background-color: rgba(0, 0, 0, 0.15); }
 .timeline-item { position: relative; margin-bottom: 50px; padding-left: 60px; }
 .timeline-dot { border: 4px solid var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--heading-color); z-index: 1; position: absolute; left: 0; top: 4px; width: 44px; height: 44px;}
 .timeline-content h4 { font-size: 18px; font-weight: 700; color: var(--text-color); margin-bottom: 5px; }
 .timeline-content p { font-size: 15px; color: var(--subtitle-color); margin-bottom: 10px; }
 .timeline-content li { font-size: 15px; color: var(--text-color); opacity: 0.9; padding-left: 20px; position: relative; margin-bottom: 8px; list-style: none; }
 .timeline-content li::before { content: '·'; position: absolute; left: 0; color: var(--heading-color); font-weight: bold; font-size: 20px; line-height: 1; }
 .about-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 80px; }
 .about-image img { width: 100%; border-radius: 12px; box-shadow: var(--shadow-md); }
 .about-text h3 { font-family: var(--font-heading); font-size: 32px; color: var(--heading-color); margin-bottom: 20px; line-height: 1.4; }
 .about-text h3 strong { display: block; }
 .about-text p { margin-bottom: 1.5em; }
 .about-text p:last-child { margin-bottom: 0; }
 .contact-container { max-width: 700px; margin: 0 auto; padding: 50px; border-radius: 12px; box-shadow: var(--shadow-md); text-align: center; }
 .contact-info a { font-size: 22px; font-weight: 500; color: var(--subtitle-color); text-decoration: none; }
 .social-links { margin-top: 40px; display: flex; justify-content: center; gap: 50px; }
 .social-links a { color: var(--subtitle-color); transition: color 0.3s ease, transform 0.3s ease; }
 .social-links a:hover { color: var(--heading-color); transform: translateY(-3px); }
 .social-links a i { font-size: 44px; }
 .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0, 0, 0, 0.8); }
 .modal-content { position: relative; margin: 5% auto; padding: 30px 40px; border-radius: 12px; width: 90%; max-width: 900px; box-shadow: var(--shadow-md); animation: slideIn 0.4s ease-out; }
 .close-button { color: var(--subtitle-color); position: absolute; top: 15px; right: 25px; font-size: 35px; font-weight: bold; cursor: pointer; }
 .close-button:hover, .close-button:focus { color: var(--heading-color); }
 @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
 @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { translateY(0); opacity: 1; } }
 .modal-video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background-color: #000; border-radius: 8px; margin-bottom: 25px; }
 .modal-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
 .modal-details h3 { font-family: var(--font-heading); font-size: 28px; color: var(--heading-color); margin: 0 0 15px; }
 .modal-details h4 { font-family: var(--font-body); font-weight: 700; font-size: 16px; color: var(--text-color); margin-top: 20px; margin-bottom: 10px; border-left: 3px solid var(--primary-color); padding-left: 10px; }
 .modal-details p { font-size: 15px; margin-bottom: 10px; color: var(--text-color); opacity: 0.9; line-height: 1.8; }
 #wechatModal .modal-content { max-width: 350px; text-align: center; padding-top: 40px; }
 #wechatModal img { width: 80%; max-width: 200px; margin: 20px auto; display: block; border-radius: 8px; }
 #wechatModal p { font-size: 16px; margin-bottom: 5px; }
 #wechatModal .wechat-id { font-weight: bold; padding: 5px 10px; border-radius: 5px; display: inline-block; cursor: pointer; }
 #wechatModal .copy-feedback { font-size: 12px; color: var(--heading-color); height: 15px; margin-top: 5px; font-weight: bold; }
 .navbar .container { display: flex; justify-content: space-between; align-items: center; }
 .navbar .nav-logo { font-family: var(--font-heading); font-size: 24px; font-weight: 700; text-decoration: none; color: var(--text-color); }
 .nav-links { list-style: none; display: flex; align-items: center; }
 .nav-links li { margin-left: 35px; }
 .nav-links a { text-decoration: none; font-weight: 500; position: relative; padding-bottom: 5px; color: var(--text-color); opacity: 0.7; transition: opacity 0.3s; }
 .nav-links a:hover { opacity: 1; }
 .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background-color: var(--heading-color); transition: width 0.3s ease; }
 .nav-links a:hover::after { width: 100%; }
 .lang-switcher { display: flex; align-items: center; gap: 5px; margin-left: 20px; }
 .lang-switcher span { color: var(--text-color); opacity: 0.5; font-size: 14px; user-select: none; }
 .lang-switcher a.lang-btn { text-decoration: none; font-weight: 700; font-size: 14px; padding: 2px 5px; border-radius: 5px; color: var(--text-color); opacity: 1; }
 .lang-switcher a.lang-btn.active { background-color: var(--primary-color); color: var(--text-color); opacity: 1; }

 /* 响应式调整 */
 @media (max-width: 992px) {
 #home .container { /* 移动端重新限制 container 宽度和 padding */
 max-width: 1200px; 
 padding: 0 40px;
 }
 .hero-container {
 grid-template-columns: 1fr; /* 在中等屏幕下改为单列 */
 text-align: center;
 padding: 0; /* 移除自定义 padding */
 max-width: none; /* 允许其根据内容自行调整宽度 */
 }
 .hero-image-wrapper {
 margin: 40px auto 0; /* 居中图片 */
 order: -1; /* 将图片移到文本上方 */
 justify-content: center; /* 在移动端居中 */
 max-width: 300px; /* 移动端图片尺寸限制 */
 }
 .hero-text p {
 max-width: 100%; /* 文本宽度适应 */
 margin-left: auto; /* 居中 */
 margin-right: auto; /* 居中 */
 }
 .hero-actions {
 justify-content: center; /* 按钮居中 */
 }
 /* 导航栏在移动端可能需要背景色而非图片，以保证可读性 */
 .navbar {
 background-image: none;
 background-color: rgba(240, 242, 241, 0.7); /* 移动端重新引入磨砂背景色 */
 backdrop-filter: blur(12px);
 -webkit-backdrop-filter: blur(12px);
 }
 /* 移动端标签字体缩小 */
 .project-content .tags {
 font-size: 10px;
 padding: 3px 8px;
 }
 }
 </style>
</head>
<body>

<div id="app-wrapper">
 <nav class="navbar"><div class="container"><a href="#home" class="nav-logo">WMQ</a><ul class="nav-links"><li><a href="#portfolio" data-lang-key="nav_portfolio"></a></li><li><a href="#timeline" data-lang-key="nav_timeline"></a></li><li><a href="#about" data-lang-key="nav_about"></a></li><li><a href="#contact" data-lang-key="nav_contact"></a></li></ul><div class="lang-switcher"><a href="#" class="lang-btn" data-lang="zh">中</a><span>/</span><a href="#" class="lang-btn" data-lang="en">EN</a></div></div></nav>
 <section id="home"><div class="container hero-container"><div class="hero-text"><p style="font-weight: 500;" data-lang-key="hero_greeting"></p><h1>王渼荃</h1><div class="typed-output"><span class="static-role"></span></div><p data-lang-key="hero_intro"></p><div class="hero-actions"><a href="#portfolio" class="btn" data-lang-key="hero_btn_explore"></a><a href="assets/files/my_cv.pdf" class="btn btn-secondary" target="_blank" rel="noopener noreferrer" data-lang-key="hero_btn_cv"></a></div></div><div class="hero-image-wrapper"><div class="background-shape"></div><img src="assets/images/my-photo.jpg" alt="王渼荃的个人照片"></div></div></section>
 
 <section id="portfolio">
 <div class="container">
 <div class="section-title">
 <h2 data-lang-key="portfolio_title"></h2>
 <p data-lang-key="portfolio_subtitle"></p>
 </div>
 <div class="portfolio-grid">
 <h3 class="portfolio-category-title" data-lang-key="cat_aigc"></h3>
 <div class="project-card" data-project-id="project1"><div class="project-image"><img src="assets/images/project-peekaboo.jpg" alt="Peekaboo"></div><div class="project-content"><div class="tags" data-lang-key="p1_tags"></div><h3 data-lang-key="p1_title"></h3></div></div>
 <div class="project-card" data-project-id="project2"><div class="project-image"><img src="assets/images/project-companion.jpg" alt="Companion Trailer"></div><div class="project-content"><div class="tags" data-lang-key="p2_tags"></div><h3 data-lang-key="p2_title"></h3></div></div>
 
 <h3 class="portfolio-category-title" data-lang-key="cat_doc"></h3>
 <div class="project-card" data-project-id="project4"><div class="project-image"><img src="assets/images/project-taohua.jpg" alt="Tao Hua Zong Meng"></div><div class="project-content"><div class="tags" data-lang-key="p4_tags"></div><h3 data-lang-key="p4_title"></h3></div></div>
 <div class="project-card" data-project-id="project5"><div class="project-image"><img src="assets/images/project-chunheqiu.jpg" alt="Chunheqiuye"></div><div class="project-content"><div class="tags" data-lang-key="p5_tags"></div><h3 data-lang-key="p5_title"></h3></div></div>
 <div class="project-card" data-project-id="project6"><div class="project-image"><img src="assets/images/project-chongqing.jpg" alt="City of Echoing Rhymes"></div><div class="project-content"><div class="tags" data-lang-key="p6_tags"></div><h3 data-lang-key="p6_title"></h3></div></div>

 desc: '“Love You Like a Movie” is a music video that uses fixed and handheld shots to simulate a dramatic sense of intertwined time and space, giving the film a well-paced rhythm. It not only pays homage to romantic classics in the streets and alleys of Chongqing but also conveys deep reflections on the true meaning of "ideals," "love," and life. The theme evokes the pursuit of love and ideals, as well as an unyielding spirit.',
 insp: 'The inspiration for this work comes from the cinematic classics interwoven with light and shadow—the delicacy of "Love Letter," the brilliance of "La La Land," and the warmth of "Léon: The Professional"... They not only shaped my viewing trajectory but also gave me rich life experiences: deep thoughts in solitude, light dances in joy, and even relief after sacrifice. I dedicated myself to creating this work, allowing the protagonists to travel between reality and cinematic dreams, recreating classic moments of love films through the magic of parallel montage.'
 },
 project4: { 
 title: 'Dream of the Peach Blossom Clan', 
 videoId: 'BV1yQ9YBNEcc', // Bilibili ID
 awards: 'Excellent Graduation Project',
 desc: 'This work, exemplified by Zhai Jun, a custodian of clan culture, tells of his steadfast adherence to clan culture amidst rapid societal development. Through in-depth follow-up filming, it reveals the efforts Zhai Jun has made in upholding clan culture, and the persistence and responsibility he demonstrates when facing various challenges.<br><br>At the same time, this work focuses on exploring the contemporary value of clan culture. Using Zhai Jun\'s individual actions as a starting point, it aims to lead the public to reflect on the important significance of clan culture to individuals, families, and society. Centered on Zhai Jun\'s true story of preserving clan culture, the documentary seeks to explore traditional culture, aiming to awaken public attention to clan culture and resonate with it, working together for its inheritance.',
 insp: 'In my opinion, "dream" represents an individual\'s aspirations and hopes for the future, and can also refer to the shared direction and goals of a group. "Clan Dream" is the reconstruction of the Zhaishi clan culture of Shuidong. Looking back at those glorious years also brings expectations for a blossoming future. The proposal of "dream" in "Dream of the Peach Blossom Clan" presents Mr. Zhai Jun\'s deep affection for his family, and also serves as a re-examination of self-identity and culture in the context of globalization.<br><br>Similarly, the story experienced by Zhai Jun serves as a highly appropriate reminder for us, living in today\'s environment of multicultural conflict and integration. It makes us understand the importance of always maintaining our cultural identity and cultural recognition, firmly adhering to our cultural roots, and preserving cultural dignity. Let us hold fast to our cultural roots, respect and appreciate each other\'s cultures, jointly safeguard the diverse cultures of humanity, and strive to build a better world for all.'
 },
 project5: { 
 title: 'Spring禾 & Autumn野 - The Bakery Awaiting Wind and You', 
 videoId: 'BV1Df9eBEEzT', // Bilibili ID
 desc: 'This film, centered on "freedom," documents the daily life of Xiao Ye, the owner of the "Chunheqiuye" bakery in Chongqing\'s Nanshan. We do not intend to tell a story of successful entrepreneurship, but rather to present a choice: what kind of mornings, evenings, and seasons one experiences when they decide to live at the pace of dough fermentation and measure time by the warmth of a kiln fire.<br><br>The film employs an observational documentary style, avoiding dramatic conflict. Through daily details such as kneading dough, waiting, baking, and conversing with customers, the three words "relaxed, slow, free" etched into the shop naturally grow into the visuals. We hope the audience is illuminated by the light from rising flour, touched by the aroma of freshly baked bread, and prompted to ask themselves—what does my understanding of freedom look like?',
 insp: 'Chunheqiuye: Spring is fermentation, He is wheat fields, Qiu is kiln fire, Ye is Nanshan. Spring kneads in mountain mist and yeast, summer endures the humid wait, autumn bakes crispy crusts the color of fallen leaves, winter wraps the chill outside the window in dough. Let each batch of bread become a fruit of time, and let this small shop become a solar term on the edge of the city—reminding those hurrying down the mountain: some aromas are worth a whole mountain\'s slow nurturing.<br><br>The backdrop to all of this is Xiao Ye\'s constant saying: "Love, for me, means I\'m willing to start over no matter how many times." She says her entire ambition is a life of freedom. A wooden sign on the ordering counter is carved with three words: "Relaxed, Slow, Free."<br><br>Thus, the meaning of this bakery becomes even clearer: its aroma is not just for the palate, but a silent invitation—to let everyone who pushes open the wooden door try, try to pause in the scent of wheat, try to relearn freedom at the pace of fermenting dough.'
 },
 project6: { 
 title: 'City of Echoing Rhymes', 
 videoId: 'BV1KW9aBvExD', // Bilibili ID
 awards: '3rd Prize in Chongqing "IP·Future Creation" Humanities Documentary Short Film + Excellent Copyright Award',
 desc: '"City of Echoing Rhymes" is a short documentary focusing on the humanistic spirit of Chongqing, aiming to collect and preserve the rich cultural heritage of this city. During filming, it was the plum rain season, and the scenes were often filled with rain, creating a slightly cool tone. Through blurred individuals and distinct silhouettes, we conveyed the spirit of the "Bangbang" porters.<br><br>The Chuanjiang Haozi (river chants) are the labor symphony of the Sichuan-Chongqing region, and boatmen symbolize Chongqing\'s openness and inclusiveness on the river. The filming location was the last car ferry terminal in Chongqing\'s main urban area, where we saw the persistence and struggle of yesterday\'s laborers in modern boatmen.<br><br>The Zhongao Fire Dragon was listed as a municipal intangible cultural heritage by the Chongqing municipal government in 2012. It evolved from an initial "loyalty and filial piety" cultural activity into a widely participated folk custom for blessings and good fortune. The inheritor is an elderly gentleman in his seventies, whose dedication to the fire dragon production craft and love for fire dragon culture were authentically recorded on camera.',
 insp: 'The inspiration for this work stems from my deep reflection on the development and changes of Chongqing. Due to the unique geographical environment of Chongqing, a mountain city, the "Bangbang" porters emerged as a special occupation. They are active in every corner and dock of Chongqing, carrying goods and luggage for merchants and travelers for decades, relying on their shoulders and backs. However, with the changes of the times, the Bangbang seem to be increasingly unable to adapt, and in the cycle of years, the once young men have gradually entered old age.<br><br>As a river city, the confluence of the Yangtze and Jialing rivers sparks Chongqing\'s vitality and spirit. The diligent and brave character of Chongqing people remains consistent, and their open and inclusive spirit has never changed.<br><br>In addition, Chongqing is also known as the "Fog City," and the continuous mist adds a mysterious atmosphere to the city. The Chongqing Fire Dragon is a folk art in traditional Chinese culture, representing the Chongqing people\'s pursuit and dedication to beauty, symbolizing their spirit of continuous exploration and innovation, and their always adhering to the concept of "striving for excellence."'
 },
 project7: { 
 title: 'Joy in the World', 
 videoId: 'BV1hV9aBGEUb', // Bilibili ID
 awards: '3rd Prize in Bashu Culture Tourism Corridor Dazu Rock Carvings Chinese Attire Video + Featured in Chongqing Daily',
 desc: 'In this creation, I tried to capture the essence of Dazu Rock Carvings\' past and present, showcasing its ancient charm and spiritual guidance. Through delicate cinematic language and vivid sound effects, the audience feels as if they are in a clear stream of the present world, experiencing the slow passage of time and the return to their inner self. I hope to present a leisurely time as if in the Tang and Song dynasties, where the audience can immerse themselves in the profound history and cultural heritage.<br><br>Delving into the expression of Zen, by blending tranquil natural landscapes with details among the rock carvings, the work attempts to evoke deeper reflections on life and the pursuit of inner peace. Through such visual and auditory experiences, I strive to allow the audience to appreciate art while also feeling an inner tranquility and strength, thereby injecting a touch of freshness and spirituality into busy modern life.',
 insp: 'The inspiration for this creation comes from the philosophical concept of "simplicity to the ultimate," aiming to convey a tranquil and profound Zen atmosphere through the exquisite art of Dazu Rock Carvings in Chongqing. As a treasure of Chinese culture, Dazu Rock Carvings embody rich historical and artistic values, with their exquisite carving techniques and profound religious connotations being captivating. In a rapidly changing modern society, we often long for a peaceful place of our own, and Dazu Rock Carvings are precisely such an existence.'
 },
 project8: {

 awards: 'Excellent Award in the 15th University Advertising Art Competition',

 },
 project9: { 
 title: 'A Tipsy Moment',

 insp: 'The inspiration for this work comes from observations and reflections on the lives of urban women. In the fast-paced urban life, female consumers are like elegant dancers, pursuing both health and quality of life, while also longing to find their own little joys amidst the busy rhythm. Such life scenes inspired us to create this work. We hope to show how women, when facing various life challenges, can feel the joy and relaxation after a slight tipsiness with Shawa mixed drinks, allowing them to find happiness both in social settings and in solitude. The tipsy state becomes a symbol, representing women gracefully twirling through the rhythm of life, rediscovering themselves, and performing their own magnificent movements.'

 let currentLang = 'zh'; 
 let typed; // Declare typed variable globally or in a scope accessible by switchLanguage

 const langSwitcher = document.querySelector('.lang-switcher'); 
 const langButtons = document.querySelectorAll('.lang-btn'); 
 const projectModal = document.getElementById('projectModal'); 
 const projectModalContent = document.getElementById('modal-body-content'); 
 const projectCloseBtn = projectModal.querySelector('.close-button'); 
 const wechatBtn = document.getElementById('wechat-btn'); 
 const wechatModal = document.getElementById('wechatModal'); 
 const wechatCloseBtn = wechatModal.querySelector('.close-button'); 
 const wechatIdSpan = wechatModal.querySelector('.wechat-id'); 
 const copyFeedback = wechatModal.querySelector('.copy-feedback');
 const typedOutputElement = document.querySelector('.typed-output .static-role');

 function initializeTypedJs(lang) {
 if (typed) {
 typed.destroy(); // Destroy previous instance if it exists
 }
 typed = new Typed(typedOutputElement, {
 strings: translations[lang].typing_strings,
 typeSpeed: 70,
 backSpeed: 40,
 loop: true,
 showCursor: true,
 cursorChar: '|',
 });
 }
 
 function switchLanguage(lang) { 
 if (!translations[lang]) return; 
 currentLang = lang; 
 document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'; 
 
 document.querySelectorAll('[data-lang-key]').forEach(el => { 
 const key = el.getAttribute('data-lang-key'); 
 if (translations[lang][key] !== undefined) { 
 // For tags, we use innerHTML directly because it contains <span> and <br>
 if (el.classList.contains('tags')) {
 el.innerHTML = translations[lang][key];
 } else {
 el.innerHTML = translations[lang][key]; 
 }
 }
 }); 
 
 initializeTypedJs(lang); // Re-initialize Typed.js for the new language
 
 langButtons.forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-lang') === lang)); 
 }
 
 function openProjectModal(projectId) { 
 const projectData = projectsData[currentLang][projectId]; 
 if (!projectData) return; 
 
 let videoPlayerHtml = ''; 
 // 统一使用 Bilibili 播放器，通过 videoId 加载
 if (projectData.videoId) { 
 videoPlayerHtml = `<iframe src="//player.bilibili.com/player.html?bvid=${projectData.videoId}&page=1&as_wide=1&high_quality=1&danmaku=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`; 
 } else {
 // 如果没有 videoId，可以显示一个占位符或者错误信息
 videoPlayerHtml = `<div style="text-align: center; padding: 50px; background-color: #333; color: #fff;">Video not available.</div>`;
 }
 
 let detailsHtml = `<div class="modal-details"><h3>${projectData.title}</h3>`; 
 if (projectData.awards) { detailsHtml += `<h4>${translations[currentLang].modal_awards}</h4><p>${projectData.awards}</p>`; } 
 if (projectData.desc) { detailsHtml += `<h4>${translations[currentLang].modal_desc}</h4><p>${projectData.desc}</p>`; } 
 if (projectData.story) { detailsHtml += `<h4>${translations[currentLang].modal_story}</h4><p>${projectData.story}</p>`; } 
 if (projectData.insp) { detailsHtml += `<h4>${translations[currentLang].modal_insp}</h4><p>${projectData.insp}</p>`; } 
 detailsHtml += '</div>'; 
 
 projectModalContent.innerHTML = `<div class="modal-video-container">${videoPlayerHtml}</div>${detailsHtml}`; 
 projectModal.style.display = 'block'; 
 document.body.style.overflow = 'hidden'; 
 }
 
 function closeProjectModal() { 
 projectModal.style.display = 'none'; 
 projectModalContent.innerHTML = ''; 
 if (wechatModal.style.display !== 'block') { 
 document.body.style.overflow = ''; 
 } 
 }
 
 function openWechatModal() { 
 const wechatId = wechatBtn.getAttribute('data-wechat-id'); 
 wechatIdSpan.textContent = wechatId; 
 wechatModal.querySelector('[data-lang-key="wechat_modal_title"]').innerHTML = translations[currentLang].wechat_modal_title; 
 wechatModal.querySelector('[data-lang-key="wechat_modal_p"]').innerHTML = translations[currentLang].wechat_modal_p; 
 copyFeedback.textContent = ''; 
 wechatModal.style.display = 'block'; 
 document.body.style.overflow = 'hidden'; 
 }
 
 function closeWechatModal() { 
 wechatModal.style.display = 'none'; 
 if (projectModal.style.display !== 'block') { 
 document.body.style.overflow = ''; 
 } 
 }
 
 langSwitcher.addEventListener('click', (e) => { 
 e.preventDefault(); 
 const lang = e.target.getAttribute('data-lang'); 
 if (lang && lang !== currentLang) { 
 switchLanguage(lang); 
 } 
 }); 
 
 document.querySelectorAll('.project-card').forEach(card => { 
 card.addEventListener('click', () => { 
 const projectId = card.getAttribute('data-project-id'); 
 openProjectModal(projectId); 
 }); 
 }); 
 
 wechatBtn.addEventListener('click', function (e) { 
 e.preventDefault(); 
 openWechatModal(); 
 }); 
 
 wechatIdSpan.addEventListener('click', function () { 
 navigator.clipboard.writeText(this.textContent).then(() => { 
 copyFeedback.textContent = translations[currentLang].wechat_copy_feedback; 
 setTimeout(() => { 
 copyFeedback.textContent = ''; 
 }, 2000); 
 }); 
 }); 
 
 projectCloseBtn.onclick = closeProjectModal; 
 wechatCloseBtn.onclick = closeWechatModal; 
 
 window.onclick = function (event) { 
 if (event.target == projectModal) { 
 closeProjectModal(); 
 } 
 if (event.target == wechatModal) { 
 closeWechatModal(); 
 } 
 };

 // Add keyboard accessibility for modals
 document.addEventListener('keydown', function(event) {
 if (event.key === 'Escape') {
 if (projectModal.style.display === 'block') {
 closeProjectModal();
 }
 if (wechatModal.style.display === 'block') {
 closeWechatModal();
 }
 }
 });
 
 switchLanguage('zh'); // 页面加载时默认中文
});
</script>

</body>
</html>
