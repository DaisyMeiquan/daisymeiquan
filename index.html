 <style>

 * { margin: 0; padding: 0; box-sizing: border-box; }

 section, footer {

 section::before, footer::before {
 content: '';

 top: 0;
 left: 0;
 width: 100%;
 height: 100%;

 }
 #home::before { background-color: rgba(255,255,255,0.4); }
 #portfolio::before { background-color: rgba(255,255,255,0.45); backdrop-filter: blur(5px); }
 #timeline::before, #about::before { background-color: rgba(255,255,255,0.5); backdrop-filter: blur(5px); }
 #contact::before { background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0.1)); backdrop-filter: blur(3px); }
 footer::before { background: transparent; }

 #home { background-image: url('assets/images/mother-of-pearl.jpg'); min-height: calc(100vh - 90px); display: flex; align-items: center; padding-top: 0; }
 #portfolio { background-image: url('assets/images/background-portfolio.jpg'); }
 #timeline, #about { background-image: url('assets/images/background-portfolio(1).jpg'); }
 #contact, footer { background-image: url('assets/images/mother-of-pearl.jpg'); }
 footer { padding: 40px 0; text-align: center; }
 
 .container { 
 position: relative;
 z-index: 2;

 margin: 0 auto;

 }

 .section-title { text-align: center; margin-bottom: 60px; }

 .section-title p { font-size: 16px; color: var(--subtitle-color); max-width: 600px; margin: 0 auto; }
 .btn { display: inline-block; background: var(--primary-color); color: var(--text-color); padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; border: 2px solid var(--primary-color); transition: all 0.3s ease; box-shadow: var(--shadow-sm); }
 .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); background: #e9a5b4; }
 .btn-secondary { background: transparent; color: var(--heading-color); border-color: var(--heading-color); }
 .btn-secondary:hover { background: var(--heading-color); color: #fff; }
 
 /* 首页布局 - 图片放大 */
 .hero-container { 
 display: grid; 
 grid-template-columns: 1.2fr 1fr;

 gap: 60px;

}
 .hero-text { text-align: left; }

 .about-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 60px; }

 .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }

 .navbar .container { display: flex; justify-content: space-between; align-items: center; }

 @media (max-width: 992px) {

 }
 @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
 </style>

<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
 // ================= 完整项目数据（中英文，所有视频使用B站链接）=================
 const projectsData = {
 zh: {
   project1: { title: 'Peekaboo 躲猫猫', videoId: 'BV1x9RCBqEQp', tags: ['AIGC剧情短片', '独立制作'], tagFull: '香港数码港AI生成电影创意大赛冠军 + 最佳叙事奖', awards: '香港数码港AI生成电影创意大赛冠军 + 最佳叙事奖', desc: '作为本片的独立制作人，我在完成剧本后，运用AIGC工具链主导了分镜、角色设计、动画生成与后期合成的全流程。', insp: '这个故事源于一个简单的疑问：当一个阿尔茨海默症患者的记忆逐渐模糊，他最想留住的是什么？查阅资料时，我发现患者常常忘记几分钟前的事，却对几十年前的画面记忆犹新。<br><br>于是我想象一种“记忆协议”——趁还记得，把最快乐的瞬间封存进金色阳光里：薰衣草田、游乐园、电话亭里的躲猫猫。相机按下快门的那一刻，色彩是满的、暖的、活的。<br><br>我以阿尔兹海默症患者这个庞大的群体为创作基础，立足于他们最真实的困境——忘记亲人的面孔，也忘记镜子里那个苍老的自己。当记忆断裂、语言失效，我们依然可以用最简单的游戏，与他们保持连接。<br><br>躲猫猫。数到一百，然后在老地方等你。陪伴是最好的良药。这就是《Peekaboo》想说的。' },
   project2: { title: '《伴侣》预告片', videoId: 'BV11dRCBKE78', tags: ['AIGC剧情片', '编导/制作'], tagFull: '奇幻 / 剧情 / 心理超现实', desc: '个人探索项目（创作中），这是我个人发起的一项AIGC创作实验，探索AI在镜头语言与氛围营造中的表现边界。', story: '24岁白领林晚深夜加班后坠入梦境，目睹三重隐喻：水中舞者高举火把却无视淹没至胸口的危机；屋顶嬉笑的成年人徒具童真的躯壳；舞台扇后舞者因久戴面具而迷失真我。惊醒于凌晨工位，她意识到焦虑的本质非惧失去，而是恐惧在麻木忙碌中丧失自我觉察。最终持辞职信走向办公室，完成从"忘我沉沦"到"清醒自救"的觉醒。<br><br>故事以超现实梦境解构当代青年的存在困境，探讨工具理性对人的异化与主体意识的回归。' },
   project3: { title: '桃花宗梦', videoId: 'BV1yQ9YBNEcc', tags: ['纪录片', '独立制作'], tagFull: '优秀毕业设计', awards: '优秀毕业设计', desc: '本作品是以宗族文化传承者翟军个人行为为例，讲述在当今社会快速发展的过程中，翟军对宗族文化的坚守，并通过深入跟踪拍摄，揭示翟军在坚守宗族文化路上所付出的努力，以及他面对各种问题时所展现的坚持与担当。<br><br>同时，本作品着重对宗族文化的当代价值进行探究，以翟军的小我行为打开话题，引领公众思考宗族文化对个人、家庭以及社会的重要意义。', insp: '在我看来，“梦”是个人心中对未来的憧憬和希望，也可以指代一个群体共同奋斗的方向和目标。“宗梦”则是水东翟氏宗族文化的重构。对于过往的那些辉煌岁月进行回望，也会对未来的花样年华产生期许。《桃花宗梦》里“梦”的提出，呈现了翟军先生对家族的深厚情怀，同时也是对全球化背景下自我身份与文化的再度审视。' },
   project4: { title: '春禾秋野——面包店等风也等你', videoId: 'BV1Df9eBEEzT', tags: ['纪录片', '剪辑'], tagFull: '纪实/人文', desc: '本片以“自由”为内核，记录重庆南山面包店“春禾秋野”主理人小野的山居日常。我们无意讲述一个成功创业的故事，而是想呈现一种选择：当一个人决定以面团发酵的速度来生活，以窑火的温度来丈量时间的刻度，她会看到怎样的晨昏与四季。<br><br>影片采用观察型纪实手法，不制造戏剧冲突，仅通过揉面、等待、烘焙、与客人交谈等日常细节，让“松弛、慢、自由”这三个刻在店里的词，自然地生长进画面里。', insp: '春禾秋野：春是发酵，禾是麦田，秋是炉火，野是南山。让每一炉面包都成为时间的果实。小野说：“所谓热爱，就是无论重新开始多少次，我都愿意。”她全部的野心就是自由的一生。' },
   project5: { title: '重韵之城', videoId: 'BV1KW9aBvExD', tags: ['纪录片/人文/纪实', '编导/摄影'], tagFull: '重庆“IP·创未来”人文纪录短片三等奖 + 优秀版权奖', awards: '重庆“IP·创未来”人文纪录短片三等奖 + 优秀版权奖', desc: '《重韵之城》是一部聚焦重庆人文精神的纪录短片，旨在拾捡与传承这座城市丰富的文化底蕴。拍摄期间正值梅雨季，画面中常常弥漫着雨景，营造出一种偏冷的影调。我们通过模糊的个体与立体的剪影，传达出棒棒群像的精神。<br><br>川江号子是川渝地区的劳动交响曲，船工则象征着重庆江上的开放包容。', insp: '这个作品的创作灵感源自我对重庆这座城市发展变迁的深刻思考。由于山城重庆独特的地理环境，孕育了“棒棒”这一特殊行业。他们活跃在重庆的每一个街角和码头，数十年来依靠肩挑背抗来为商贾旅人搬运货物与行李。然而，随着时代的变化，棒棒们似乎变得越来越难以适应。' },
   project6: { title: '像电影一样爱你', videoId: 'BV1Pb9aBwEjS', tags: ['微电影 / 音乐MV', '导演/编剧'], tagFull: '重庆艺术展演微电影三等奖 + 大学生技能大赛一等奖 + 入围csff影展', awards: '重庆艺术展演微电影三等奖 + 大学生技能大赛一等奖 + 入围csff影展', desc: '《像电影一样爱你》作为一部音乐MV设计了固定镜头和手持镜头模拟出时空交错的戏剧感，使影片节奏张弛有度，不仅在重庆的大街小巷中致敬了浪漫的经典桥段，也传达出对于“理想”、“爱情”真谛和人生的深深思索。', insp: '这个作品的创作灵感源自光影交织的电影经典——《情书》的细腻、《爱乐之城》的璀璨，以及《这个杀手不太冷》的温情……我倾心打造了这部作品，让男女主角穿梭于现实与电影梦境之间，通过平行蒙太奇的魔法，重现一幕幕爱情电影的经典瞬间。' },
   project7: { title: '足满人间', videoId: 'BV1hV9aBGEUb', tags: ['文化宣传片', '美术/剪辑'], tagFull: '巴蜀文化旅游走廊大足石刻华服视频三等奖 + 荣登重庆日报', awards: '巴蜀文化旅游走廊大足石刻华服视频三等奖 + 荣登重庆日报', desc: '在这个创作中，我试图捕捉大足石刻前世今生的精髓，展现其古韵悠长与精神指引。通过细腻的镜头语言和生动的音效，观众仿佛置身于一股现世中的清流，感受到时间的缓缓流逝与自我内心的回归。', insp: '这个创作灵感源于“大道至简”的哲学理念，旨在通过重庆大足石刻的唯美艺术，传达出一种宁静而深邃的禅意氛围。' },
   project8: { title: '81岁的HBN美少女', videoId: 'BV1y89aBhEVA', tags: ['创意广告', '编导'], tagFull: '第15届大学生广告艺术大赛优秀奖', awards: '第15届大学生广告艺术大赛优秀奖', desc: '影片采用黑白复古的色调处理，不仅增强了画面的艺术感，还仿佛将观众带回过去，为整个广告增添了一种独特的时光穿梭感。与此相辅相成的是轻快的音乐以及精准的广告词字幕，它们共同营造出愉悦的观赏体验。', insp: '这个作品的创作灵感源于对时间与年龄的幽默思考，以及对人们对衰老焦虑的巧妙回应。我们希望通过一个18岁与一个81岁的对比，展现生活中日常幽默的误会，以此反映出我们产品卓越“抗衰”功能的独特魅力。' },
   project9: { title: '微醺一刻', videoId: 'BV1UJ9aBME2Q', tags: ['创意广告', '编导/剪辑'], tagFull: '第33届时报金犊奖大陆赛区优秀广告设计奖 + 剪辑奖', awards: '第33届时报金犊奖大陆赛区优秀广告设计奖 + 剪辑奖', desc: '作品策划了多个关键元素，以“微醺”效果为主题，形象化地将这一状态符号化，突出莎娃产品的独特功能。我们运用色彩丰富的视觉效果来增强产品表现力，通过强烈的色彩对比与生动的镜头切换，形成“境随心转”的视觉体验。', insp: '这个作品的创作灵感来源于对都市女性生活的观察和思考。在快节奏的都市生活中，女性消费者如同优雅的舞者，既追求健康与品质生活，又渴望在繁忙的旋律中找到属于自己的小确幸。' }
 },

 let currentLang = 'zh';
 let typedInstance = null;

 function initTyped() {
   if(typedInstance) typedInstance.destroy();
   typedInstance = new Typed('#typed-role', {
     strings: translations[currentLang].typing_strings,
     typeSpeed: 70, backSpeed: 40, backDelay: 1800, loop: true, cursorChar: '|'
   });
 }

 function renderPortfolio() {
   const grid = document.getElementById('portfolioGrid');
   const categories = [
     { key: 'cat_aigc', ids: ['project1','project2'] },
     { key: 'cat_doc', ids: ['project3','project4','project5'] },
     { key: 'cat_mv', ids: ['project6'] },
     { key: 'cat_commercial', ids: ['project7','project8','project9'] }
   ];
   let html = '';
   for(let cat of categories) {
     html += `<h3 class="portfolio-category-title" data-lang-key="${cat.key}">${translations[currentLang][cat.key] || ''}</h3>`;
     for(let pid of cat.ids) {
       const p = projectsData[currentLang][pid];
       if(!p) continue;
       // 修正图片路径：使用 assets/images/project-数字.jpg 格式
       let imgNum = pid.replace('project','');
       let imgPath = `assets/images/project-${imgNum}.jpg`;
       html += `<div class="project-card" data-project-id="${pid}">
                  <div class="project-image"><img src="${imgPath}" alt="${p.title}" onerror="this.src='assets/images/placeholder.jpg'"></div>
                  <div class="project-content">
                    <h3>${p.title}</h3>
                    <div class="tags">
                      <span class="tag-item">${p.tags[0]}</span>
                      <span class="tag-item">${p.tags[1]}</span>
                    </div>
                    <span class="tag-item-full">${p.tagFull}</span>
                  </div>
                </div>`;
     }
   }
   grid.innerHTML = html;
   document.querySelectorAll('.project-card').forEach(card => {
     card.addEventListener('click', () => openModal(card.dataset.projectId));
   });
 }

 function openModal(pid) {
   const data = projectsData[currentLang][pid];
   if(!data) return;
   const videoSrc = `//player.bilibili.com/player.html?bvid=${data.videoId}&page=1&high_quality=1&danmaku=0`;
   let details = `<div class="modal-details"><h3>${data.title}</h3>`;
   if(data.awards) details += `<h4>${translations[currentLang].modal_awards}</h4><p style="text-indent:2em">${data.awards}</p>`;
   if(data.desc) details += `<h4>${translations[currentLang].modal_desc}</h4><p style="text-indent:2em">${data.desc}</p>`;
   if(data.insp) details += `<h4>${translations[currentLang].modal_insp}</h4><p style="text-indent:2em">${data.insp}</p>`;
   if(data.story) details += `<h4>${translations[currentLang].modal_story}</h4><p style="text-indent:2em">${data.story}</p>`;
   details += `</div>`;
   document.getElementById('modal-body-content').innerHTML = `<div class="modal-video-container"><iframe src="${videoSrc}" allowfullscreen></iframe></div>${details}`;
   document.getElementById('projectModal').style.display = 'block';
   document.body.style.overflow = 'hidden';
 }

 function closeModal() { document.getElementById('projectModal').style.display = 'none'; document.body.style.overflow = ''; }
 function closeWechat() { document.getElementById('wechatModal').style.display = 'none'; document.body.style.overflow = ''; }

 function renderTimeline() {
   const container = document.getElementById('timelineContainer');
   if(!container) return;
   container.innerHTML = `
     <div class="timeline-item"><div class="timeline-dot">NOW</div><div class="timeline-content"><h4 data-lang-key="t1_title"></h4><p data-lang-key="t1_school"></p><ul><li data-lang-key="t1_p1"></li><li data-lang-key="t1_p2"></li></ul></div></div>
     <div class="timeline-item"><div class="timeline-dot">2024</div><div class="timeline-content"><h4 data-lang-key="t2_title"></h4><ul><li data-lang-key="t2_p1"></li></ul></div></div>
     <div class="timeline-item"><div class="timeline-dot">2023</div><div class="timeline-content"><h4 data-lang-key="t3_title"></h4><ul><li data-lang-key="t3_p1"></li><li data-lang-key="t3_p2"></li></ul></div></div>
     <div class="timeline-item"><div class="timeline-dot">2021</div><div class="timeline-content"><h4 data-lang-key="t4_title"></h4><p data-lang-key="t4_major"></p><ul><li data-lang-key="t4_p1"></li><li data-lang-key="t4_p2"></li></ul></div></div>`;
 }

 function switchLanguage(lang) {
   if(!translations[lang]) return;
   currentLang = lang;
   document.querySelectorAll('[data-lang-key]').forEach(el => {
     const key = el.getAttribute('data-lang-key');
     if(translations[lang][key] !== undefined) el.innerHTML = translations[lang][key];
   });
   document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-lang') === lang));
   renderPortfolio();
   renderTimeline();
   initTyped();
 }

 // 初始化渲染
 renderTimeline();
 renderPortfolio();
 initTyped();
 switchLanguage('zh');

 // 事件绑定
 document.querySelector('.lang-switcher').addEventListener('click', (e) => {
   const btn = e.target.closest('.lang-btn');
   if(btn) { e.preventDefault(); const l = btn.getAttribute('data-lang'); if(l && l !== currentLang) switchLanguage(l); }
 });
 document.querySelector('#projectModal .close-button').onclick = closeModal;
 document.querySelector('#wechatModal .close-button').onclick = closeWechat;
 document.getElementById('wechat-btn').onclick = (e) => { e.preventDefault(); document.getElementById('wechatModal').style.display = 'block'; document.body.style.overflow = 'hidden'; };
 window.onclick = (e) => { if(e.target == document.getElementById('projectModal')) closeModal(); if(e.target == document.getElementById('wechatModal')) closeWechat(); };
 const wechatSpan = document.querySelector('#wechatModal .wechat-id');
 if(wechatSpan) {
   wechatSpan.innerText = 'Daisy__light';
   wechatSpan.onclick = () => { navigator.clipboard.writeText('Daisy__light'); const fb = document.querySelector('#wechatModal .copy-feedback'); if(fb){ fb.innerText = translations[currentLang].wechat_copy_feedback; setTimeout(()=>fb.innerText='',1500); } };
 }
});
</script>
